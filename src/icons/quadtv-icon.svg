<?xml version="1.0" encoding="UTF-8"?>
<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- TV/Monitor Frame -->
  <rect x="8" y="12" width="80" height="60" rx="8" ry="8" fill="#2a2a2a" stroke="#666" stroke-width="2"/>
  
  <!-- Screen bezel -->
  <rect x="12" y="16" width="72" height="52" rx="4" ry="4" fill="#000"/>
  
  <!-- 2x2 Grid of Streams -->
  <!-- Top Left Stream -->
  <rect x="16" y="20" width="32" height="20" rx="2" ry="2" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
  
  <!-- Top Right Stream (Active with red border) -->
  <rect x="52" y="20" width="32" height="20" rx="2" ry="2" fill="#1a1a1a" stroke="#ff0000" stroke-width="2"/>
  
  <!-- Bottom Left Stream -->
  <rect x="16" y="44" width="32" height="20" rx="2" ry="2" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
  
  <!-- Bottom Right Stream -->
  <rect x="52" y="44" width="32" height="20" rx="2" ry="2" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
  
  <!-- QuadTV "Q" symbol in center -->
  <circle cx="48" cy="44" r="8" fill="#ff0000" opacity="0.9"/>
  <text x="48" y="49" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Q</text>
  
  <!-- TV Stand -->
  <rect x="40" y="72" width="16" height="4" rx="2" ry="2" fill="#666"/>
  <rect x="36" y="76" width="24" height="8" rx="4" ry="4" fill="#555"/>
</svg>
